upstreams:
  - id: agent-skills
    label: Personal Skills
    kind: git
    repo: https://github.com/yuanhaorannnnnn/agent-skills.git
    branch: main
    integration_mode: managed_install
    install:
      cwd: "."
      command:
        - bash
        - scripts/install.sh
      runtime_dir: ~/.agents/skills
    notes: >
      agent-skills is a self-contained skills distribution repository.
      It maintains its own installer and exposes skills directly to
      ~/.agents/skills. The main repository no longer snapshots its contents;
      it is the first managed_install upstream.
    tracked_skills: []
  - id: ljg-skills
    label: ljg-skills
    kind: git
    repo: https://github.com/lijigang/ljg-skills.git
    branch: md
    integration_mode: managed_snapshot
    notes: >
      ljg-skills is a third-party skills repository with Markdown-form skills on
      the `md` branch. It fits the current managed_snapshot model because the
      repository exposes skill folders under `skills/`. Note that `ljg-card`
      also has extra npm/playwright dependencies which are not automatically
      installed by snapshot sync alone.
    tracked_skills:
      - name: ljg-card
        source_path: skills/ljg-card
        local_path: agent-platform/skills/ljg-card
        sync_policy: track_snapshot
      - name: ljg-invest
        source_path: skills/ljg-invest
        local_path: agent-platform/skills/ljg-invest
        sync_policy: track_snapshot
      - name: ljg-learn
        source_path: skills/ljg-learn
        local_path: agent-platform/skills/ljg-learn
        sync_policy: track_snapshot
      - name: ljg-paper
        source_path: skills/ljg-paper
        local_path: agent-platform/skills/ljg-paper
        sync_policy: track_snapshot
      - name: ljg-paper-flow
        source_path: skills/ljg-paper-flow
        local_path: agent-platform/skills/ljg-paper-flow
        sync_policy: track_snapshot
      - name: ljg-paper-river
        source_path: skills/ljg-paper-river
        local_path: agent-platform/skills/ljg-paper-river
        sync_policy: track_snapshot
      - name: ljg-plain
        source_path: skills/ljg-plain
        local_path: agent-platform/skills/ljg-plain
        sync_policy: track_snapshot
      - name: ljg-rank
        source_path: skills/ljg-rank
        local_path: agent-platform/skills/ljg-rank
        sync_policy: track_snapshot
      - name: ljg-read
        source_path: skills/ljg-read
        local_path: agent-platform/skills/ljg-read
        sync_policy: track_snapshot
      - name: ljg-relationship
        source_path: skills/ljg-relationship
        local_path: agent-platform/skills/ljg-relationship
        sync_policy: track_snapshot
      - name: ljg-roundtable
        source_path: skills/ljg-roundtable
        local_path: agent-platform/skills/ljg-roundtable
        sync_policy: track_snapshot
      - name: ljg-skill-map
        source_path: skills/ljg-skill-map
        local_path: agent-platform/skills/ljg-skill-map
        sync_policy: track_snapshot
      - name: ljg-think
        source_path: skills/ljg-think
        local_path: agent-platform/skills/ljg-think
        sync_policy: track_snapshot
      - name: ljg-travel
        source_path: skills/ljg-travel
        local_path: agent-platform/skills/ljg-travel
        sync_policy: track_snapshot
      - name: ljg-word
        source_path: skills/ljg-word
        local_path: agent-platform/skills/ljg-word
        sync_policy: track_snapshot
      - name: ljg-word-flow
        source_path: skills/ljg-word-flow
        local_path: agent-platform/skills/ljg-word-flow
        sync_policy: track_snapshot
      - name: ljg-writes
        source_path: skills/ljg-writes
        local_path: agent-platform/skills/ljg-writes
        sync_policy: track_snapshot
  - id: impeccable
    label: Impeccable Design System
    cache_name: impeccable
    kind: git
    repo: https://github.com/pbakaus/impeccable.git
    branch: main
    integration_mode: managed_snapshot
    notes: >
      pbakaus/impeccable is a design system skill for Figma and web design.
      Managed as a snapshot; linked only to selected agent runtimes.
    tracked_skills:
      - name: impeccable
        source_path: skill
        sync_policy: track_snapshot
